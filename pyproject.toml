[project]
name = "ai-code-guardian"
version = "0.1.0"
description = "AI Code Governance CI Bot — detects AI-generated code in PRs and enforces governance policies"
authors = [{ name = "deghosal-2026" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "prometheus-client>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
guardian = "guardian.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
